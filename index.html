<style>
/* Layout: one column of storyboard panels ruled in non-photo blue, like manga manuscript paper; vermilion is kept for the 決 stamp alone. */
:root{
  --paper:#f2f6fa; --sheet:#ffffff; --sheet-2:#e9f1f8; --ink:#162032; --ink-2:#536179; --ink-3:#7f8b9f;
  --rule:#c4dcef; --rule-2:#93c1e6; --blue:#2471b6; --on-blue:#ffffff; --blue-soft:#e3effa;
  --shu:#c93824; --shu-soft:#fbe8e4;
  --st-draft:#7b8698; --st-ready:#2471b6; --st-gen:#a9700b; --st-picked:#1d8064; --st-done:#162032;
  --warn:#9c5c08; --warn-bg:#fcf1de; --ok:#1d8064; --danger:#bb3221;
  --overlay:rgba(10,16,26,.5); --lift:0 10px 28px rgba(12,24,44,.22);
  --stage:#0b0f15; --stage-2:#1a222d; --on-stage:#eef2f7; --on-stage-2:#a9b4c4;
  --f-disp:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-stamp:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular","Cascadia Mono","Roboto Mono",Menlo,Consolas,"Droid Sans Mono",monospace;
  --fs:15px; --fs-in:16px;
  --r:10px; --bar-h:54px; --tab-h:60px; --col:860px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e131a; --sheet:#151d28; --sheet-2:#1c2633; --ink:#e5ebf3; --ink-2:#a0acbf; --ink-3:#717e93;
    --rule:#26384d; --rule-2:#3c5e82; --blue:#6aaeea; --on-blue:#0b1420; --blue-soft:#1a2b3e;
    --shu:#ef6247; --shu-soft:#3a1d18;
    --st-draft:#8b97a8; --st-ready:#6aaeea; --st-gen:#e2a640; --st-picked:#4cc29a; --st-done:#e5ebf3;
    --warn:#e6ac4c; --warn-bg:#2a2216; --ok:#4cc29a; --danger:#f06a58;
    --overlay:rgba(0,0,0,.6); --lift:0 10px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e131a; --sheet:#151d28; --sheet-2:#1c2633; --ink:#e5ebf3; --ink-2:#a0acbf; --ink-3:#717e93;
  --rule:#26384d; --rule-2:#3c5e82; --blue:#6aaeea; --on-blue:#0b1420; --blue-soft:#1a2b3e;
  --shu:#ef6247; --shu-soft:#3a1d18;
  --st-draft:#8b97a8; --st-ready:#6aaeea; --st-gen:#e2a640; --st-picked:#4cc29a; --st-done:#e5ebf3;
  --warn:#e6ac4c; --warn-bg:#2a2216; --ok:#4cc29a; --danger:#f06a58;
  --overlay:rgba(0,0,0,.6); --lift:0 10px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-size="l"]{ --fs:17px; --fs-in:17px; }

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:var(--fs); line-height:1.6; -webkit-tap-highlight-color:transparent; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
button:disabled{ cursor:default; opacity:.45; }
a{ color:var(--blue); }
:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
.mono{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
button svg, label svg, h3 svg{ width:20px; height:20px; flex:none; }
#sh-miss:empty{ display:none; }
.vh{ position:absolute !important; width:1px; height:1px; margin:-1px; padding:0; border:0; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; opacity:0; }
label.frame-btn, label.btn{ cursor:pointer; }
label.frame-btn:focus-within, label.btn:focus-within{ outline:2px solid var(--blue); outline-offset:2px; }
.dim{ color:var(--ink-2); }
.disp{ font-family:var(--f-disp); font-weight:600; }
h1,h2,h3{ text-wrap:balance; margin:0; }

/* ---- 上の帯 ---- */
.bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--paper); border-bottom:1px solid var(--rule); }
.bar::before{ content:""; position:absolute; left:0; right:0; bottom:100%; height:env(safe-area-inset-top,0px); background:var(--paper); }
.bar-in{ display:flex; align-items:center; gap:8px; height:var(--bar-h); max-width:var(--col); margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.bar-mid{ flex:1; min-width:0; display:flex; align-items:center; gap:10px; }
.bar-right{ display:flex; align-items:center; gap:2px; }
.logo{ width:32px; height:32px; border-radius:8px; flex:none; }
.brand{ font-family:var(--f-disp); font-weight:600; font-size:1.3em; letter-spacing:.06em; white-space:nowrap; }
.bar-title{ display:flex; align-items:center; gap:4px; min-width:0; font-weight:700; font-size:1.05em; padding:6px 4px; border-radius:8px; }
.bar-title span.t{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-title svg{ flex:none; width:18px; height:18px; color:var(--ink-3); }
.bar-h{ font-family:var(--f-disp); font-weight:600; font-size:1.2em; letter-spacing:.04em; }
.ibtn{ width:42px; height:42px; display:inline-grid; place-items:center; border-radius:10px; color:var(--ink-2); flex:none; }
.ibtn svg{ width:22px; height:22px; }
.ibtn:hover{ background:var(--sheet-2); }
.sync{ display:inline-flex; align-items:center; gap:6px; font-size:.78em; color:var(--ink-2); white-space:nowrap; padding:0 6px; }
.sync::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--ink-3); }
.sync[data-s="ok"]::before{ background:var(--ok); }
.sync[data-s="busy"]::before{ background:var(--st-gen); }
.sync[data-s="err"]::before{ background:var(--danger); }
.sync[data-s="local"]::before{ background:var(--ink-3); }

/* ---- タブ（スマホは下、広い画面は上） ---- */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--sheet); border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom,0px); }
.tabbar-in{ display:grid; grid-template-columns:repeat(5,1fr); max-width:var(--col); margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.tab{ height:var(--tab-h); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font-size:.72em; color:var(--ink-3); position:relative; letter-spacing:.04em; }
.tab svg{ width:23px; height:23px; }
.tab[aria-current="page"]{ color:var(--blue); font-weight:700; }
.tab[aria-current="page"]::after{ content:""; position:absolute; top:0; left:22%; right:22%; height:3px; border-radius:0 0 3px 3px; background:var(--blue); }
.tab .badge{ position:absolute; top:7px; left:calc(50% + 8px); min-width:17px; height:17px; padding:0 4px; border-radius:9px; font-size:10px; line-height:17px;
  background:var(--blue); color:var(--on-blue); font-family:var(--f-mono); font-weight:600; }

/* ---- 本文 ---- */
main{ max-width:var(--col); margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:14px calc(var(--tab-h) + 100px + env(safe-area-inset-bottom,0px)); display:grid; gap:14px; }
main.no-tabs{ padding-block:16px calc(110px + env(safe-area-inset-bottom,0px)); }
.stack{ display:grid; gap:10px; }
.stack-lg{ display:grid; gap:16px; }
.row-wrap{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.sec-h{ display:flex; align-items:baseline; gap:10px; margin-top:6px; }
.sec-h h2{ font-family:var(--f-disp); font-weight:600; font-size:1.15em; letter-spacing:.04em; }
.sec-h .dim{ font-size:.85em; }
.lede{ color:var(--ink-2); margin:0; font-size:.92em; }
.hint{ color:var(--ink-2); font-size:.82em; margin:0; line-height:1.55; }
.hint b{ color:var(--ink); }
.warn-t{ color:var(--warn); }
.card{ background:var(--sheet); border:1px solid var(--rule); border-radius:var(--r); }

/* 空のコマ枠（追加ボタン・空の状態） */
.frame-btn{ width:100%; min-height:64px; border:1.5px dashed var(--rule-2); border-radius:var(--r); color:var(--blue); font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:8px; background:transparent; }
.frame-btn svg{ width:20px; height:20px; }
.frame-btn:hover{ background:var(--blue-soft); }
.empty{ border:1.5px dashed var(--rule-2); border-radius:var(--r); padding:22px 18px; display:grid; gap:8px; text-align:left; }
.empty h3{ font-family:var(--f-disp); font-weight:600; font-size:1.15em; }
.empty p{ margin:0; color:var(--ink-2); font-size:.92em; }
.banner{ border:1px solid var(--rule); background:var(--sheet-2); border-radius:var(--r); padding:10px 12px; font-size:.86em; color:var(--ink-2); }
.banner.warn{ border-color:var(--warn); background:var(--warn-bg); color:var(--ink); }
.banner .link{ font-size:inherit; padding:0 2px; }
.steps{ margin:0; padding-left:1.5em; display:grid; gap:6px; color:var(--ink-2); font-size:.9em; }
.steps li::marker{ font-family:var(--f-mono); color:var(--blue); font-weight:600; }
.passrow{ display:flex; gap:6px; align-items:center; }
.passrow input{ flex:1; min-width:0; }
.nophoto{ display:grid; place-items:center; width:100%; height:100%; min-height:3em; color:var(--ink-3); font-size:.8em; padding:6px; text-align:center; }
.loading{ padding:40px 0; text-align:center; color:var(--ink-2); font-size:.9em; }
.loading i{ display:inline-block; width:8px; height:8px; margin:0 3px; border-radius:50%; background:var(--rule-2); animation:blink 1.2s infinite; }
.loading i:nth-child(2){ animation-delay:.2s } .loading i:nth-child(3){ animation-delay:.4s }
@keyframes blink{ 0%,100%{ opacity:.25 } 50%{ opacity:1 } }

/* ---- ボタン ---- */
.btn{ min-height:42px; padding:8px 14px; border-radius:9px; border:1px solid var(--rule-2); background:var(--sheet); color:var(--blue); font-weight:700;
  display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; }
.btn svg{ width:18px; height:18px; }
.btn:hover{ background:var(--blue-soft); }
.btn.pri{ background:var(--blue); border-color:var(--blue); color:var(--on-blue); }
.btn.pri:hover{ filter:brightness(1.06); }
.btn.sm{ min-height:36px; padding:5px 11px; font-size:.88em; }
.btn.ghost{ border-color:transparent; background:transparent; }
.btn.ghost:hover{ background:var(--sheet-2); }
.btn.danger{ color:var(--danger); border-color:var(--danger); }
.btn.wide{ width:100%; }
.tbtn{ display:inline-flex; align-items:center; gap:4px; color:var(--blue); font-weight:700; padding:8px 6px; border-radius:8px; font-size:.95em; }
.tbtn svg{ width:20px; height:20px; }
.link{ color:var(--blue); text-decoration:underline; text-underline-offset:2px; font-weight:600; }
.fab{ position:fixed; z-index:28; right:max(16px, env(safe-area-inset-right,0px)); bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));
  height:52px; padding:0 22px 0 18px; border-radius:26px; background:var(--blue); color:var(--on-blue); font-weight:700; font-size:1em;
  display:inline-flex; align-items:center; gap:6px; box-shadow:var(--lift); }
.fab svg{ width:22px; height:22px; }
main.no-tabs ~ .fab, .fab.no-tabs{ bottom:calc(20px + env(safe-area-inset-bottom,0px)); }

/* ---- 判子（区分） ---- */
.stamp{ width:36px; height:36px; display:grid; place-items:center; border:2px solid; border-radius:5px; font-family:var(--f-stamp); font-size:21px; line-height:1; flex:none; }
.stamp.k{ color:var(--shu); border-color:var(--shu); transform:rotate(-5deg); background:var(--shu-soft); }
.stamp.t{ color:var(--ink-2); border-color:var(--rule-2); }
.stamp.m{ color:var(--ink-3); border-style:dashed; border-color:var(--rule-2); }
.stamp-s{ width:24px; height:24px; display:inline-grid; place-items:center; border:1.5px solid; border-radius:4px; font-family:var(--f-stamp); font-size:14px; line-height:1; flex:none; }
.stamp-s.k{ color:var(--shu); border-color:var(--shu); }
.stamp-s.t{ color:var(--ink-2); border-color:var(--rule-2); }
.stamp-s.m{ color:var(--ink-3); border-style:dashed; border-color:var(--rule-2); }

/* ---- 状態の札 ---- */
.pill{ display:inline-flex; align-items:center; font-size:.74em; font-weight:700; padding:1px 8px; border-radius:999px; border:1px solid currentColor; white-space:nowrap; line-height:1.6; }
.pill[data-st="draft"]{ color:var(--st-draft); }
.pill[data-st="ready"]{ color:var(--st-ready); }
.pill[data-st="gen"]{ color:var(--st-gen); }
.pill[data-st="picked"]{ color:var(--st-picked); }
.pill[data-st="done"]{ color:var(--st-done); }
.stbar{ display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--sheet-2); }
.stbar i{ display:block; height:100%; }
.stbar .s-draft{ background:var(--st-draft); } .stbar .s-ready{ background:var(--st-ready); } .stbar .s-gen{ background:var(--st-gen); }
.stbar .s-picked{ background:var(--st-picked); } .stbar .s-done{ background:var(--st-done); }

/* ---- 作品カード ---- */
.proj{ display:grid; gap:8px; padding:14px 16px; text-align:left; width:100%; }
.proj:hover{ border-color:var(--rule-2); }
.proj-top{ display:flex; align-items:center; gap:8px; font-size:.78em; color:var(--ink-2); }
.proj-top .kind{ border:1px solid var(--rule-2); border-radius:4px; padding:0 6px; }
.proj-top .kind.claude{ border-color:var(--blue); color:var(--blue); }
.proj-top .date{ margin-left:auto; font-family:var(--f-mono); }
.proj-title{ font-weight:800; font-size:1.12em; line-height:1.4; }
.proj-log{ color:var(--ink-2); font-size:.88em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.proj-stats{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:.8em; color:var(--ink-2); }
.proj-stats b{ font-family:var(--f-mono); color:var(--ink); font-weight:600; }

/* ---- タネの書き込み欄・棚 ---- */
.capture{ background:var(--sheet); border:1.5px dashed var(--rule-2); border-radius:var(--r); padding:12px; display:grid; gap:8px; }
.capture .lbl{ display:flex; align-items:center; gap:6px; color:var(--blue); }
.capture .lbl svg{ width:18px; height:18px; }
.capture textarea{ min-height:64px; }
.capture-acts{ display:flex; justify-content:flex-end; align-items:center; gap:8px; flex-wrap:wrap; }
.shelves{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); border:1px solid var(--rule-2); border-radius:10px; overflow:hidden; background:var(--sheet); }
.shelf{ min-height:48px; display:flex; align-items:center; justify-content:center; gap:7px; font-weight:700; color:var(--ink-2); border-left:1px solid var(--rule); min-width:0; padding:0 6px; }
.shelf:first-child{ border-left:0; }
.shelf .n{ font-family:var(--f-mono); font-size:.82em; font-weight:600; min-width:1.8em; padding:0 6px; border-radius:999px; background:var(--sheet-2); color:var(--ink-2); text-align:center; }
.shelf[aria-pressed="true"]{ background:var(--blue); color:var(--on-blue); }
.shelf[aria-pressed="true"] .n{ background:var(--on-blue); color:var(--blue); }
.shelf-hint{ margin-top:-6px; }
.todo-link{ display:flex; align-items:center; gap:8px; width:100%; min-height:46px; padding:8px 12px; border-radius:var(--r); border:1px solid var(--rule); background:var(--sheet); font-weight:700; text-align:left; color:var(--ink-2); }
.todo-link svg{ width:20px; height:20px; color:var(--ink-3); }
.todo-link b{ margin-left:auto; font-family:var(--f-mono); font-weight:600; }
.todo-link.on{ color:var(--ink); }
.todo-link.on svg:first-child, .todo-link.on b{ color:var(--warn); }

/* ---- タネ・プロットのカード ---- */
.idea-c{ display:flex; align-items:flex-start; gap:12px; padding:12px 14px; text-align:left; width:100%; }
.idea-c:hover{ border-color:var(--rule-2); }
.idea-c.tane{ border-style:dashed; border-color:var(--rule-2); }
.idea-body{ flex:1; min-width:0; display:grid; gap:4px; }
.idea-title{ display:block; font-weight:800; font-size:1.05em; line-height:1.4; overflow-wrap:anywhere; }
.idea-seed{ display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-line; line-height:1.55; overflow-wrap:anywhere; }
.idea-mise{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:.88em; color:var(--ink-2); }
.idea-mise b{ color:var(--shu); font-weight:700; margin-right:6px; font-size:.92em; }
.idea-top, .idea-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; font-size:.8em; color:var(--ink-2); }
.idea-top .kind, .idea-meta .kind{ border:1px solid var(--rule-2); border-radius:4px; padding:0 6px; }
.idea-top .kind.claude, .idea-meta .kind.claude{ border-color:var(--blue); color:var(--blue); }
.idea-meta > span{ display:inline-flex; align-items:center; gap:4px; }
.idea-meta svg{ width:15px; height:15px; }
.idea-top .date, .idea-meta .date{ margin-left:auto; font-family:var(--f-mono); }
.idea-thumb{ width:58px; height:58px; border-radius:8px; overflow:hidden; border:1px solid var(--rule); flex:none; background:var(--sheet-2); }
.idea-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.proj-top .qn{ display:inline-flex; align-items:center; gap:3px; font-family:var(--f-mono); }
.proj-top .qn svg{ width:15px; height:15px; }

/* ---- タネ・プロットの画面 ---- */
.stages{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:.84em; color:var(--ink-3); }
.stages li{ display:inline-flex; align-items:center; gap:6px; }
.stages li + li::before{ content:""; width:16px; height:1.5px; background:var(--rule-2); }
.stages .sn{ width:22px; height:22px; border-radius:50%; border:1.5px solid currentColor; display:inline-grid; place-items:center; font-family:var(--f-mono); font-size:11px; font-weight:600; }
.stages .sn svg{ width:13px; height:13px; }
.stages li[data-s="done"]{ color:var(--ink-2); }
.stages li[data-s="on"]{ color:var(--blue); font-weight:800; }
.stages li[data-s="on"] .sn{ background:var(--blue); border-color:var(--blue); color:var(--on-blue); }
.seed-ta{ min-height:96px; font-size:var(--fs-in); line-height:1.75; }
.promote{ display:grid; gap:8px; border-top:1px solid var(--rule); padding-top:14px; }
.flow{ list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.flowrow{ display:grid; grid-template-columns:1.6em minmax(0,1fr) auto; align-items:center; gap:6px; }
.fno{ font-family:var(--f-mono); color:var(--ink-3); font-size:.85em; text-align:right; }
.flowrow .ibtn, .todorow .ibtn{ width:38px; height:38px; }
.flow-ro{ margin:0; padding-left:1.7em; display:grid; gap:4px; font-size:.92em; }
.flow-ro li::marker{ font-family:var(--f-mono); color:var(--ink-3); }
.todos{ list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.todorow{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:8px; }
.todorow input[type="checkbox"]{ width:22px; height:22px; accent-color:var(--ok); flex:none; margin:0; }
.todorow.done input[type="text"], .todorow.done label span{ color:var(--ink-3); text-decoration:line-through; }
.todos.ro .todorow{ display:block; }
.todos.ro label{ display:flex; align-items:flex-start; gap:10px; min-height:34px; cursor:pointer; font-size:.94em; line-height:1.5; }
.todos.ro label input{ margin-top:1px; }
.todos.ro label span{ min-width:0; overflow-wrap:anywhere; }
.todo-add{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px; }
.todo-g{ display:grid; gap:8px; padding:12px 14px; }
.todo-h{ display:flex; align-items:center; gap:8px; text-align:left; width:100%; min-height:36px; }
.todo-h b{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.todo-h .kind{ font-size:.75em; border:1px solid var(--rule-2); border-radius:4px; padding:0 6px; color:var(--ink-2); flex:none; }
.todo-h .n{ font-family:var(--f-mono); font-size:.85em; color:var(--warn); flex:none; }
.todo-h svg{ width:18px; height:18px; color:var(--ink-3); flex:none; }

/* 段取りの「はじまり」 */
.idea-box{ display:grid; gap:10px; padding:12px 14px; }
.idea-box-h{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; min-height:34px; }
.idea-box-h .lbl{ flex:1; min-width:0; }
.idea-box-h .n{ display:inline-flex; align-items:center; gap:3px; font-family:var(--f-mono); font-size:.85em; }
.idea-box-h .n svg{ width:15px; height:15px; }
.idea-box-h .caret svg{ width:18px; height:18px; color:var(--ink-3); transition:transform .15s; display:block; }
.idea-box-h[aria-expanded="true"] .caret svg{ transform:rotate(180deg); }
.idea-quote{ margin:0; padding:2px 0 2px 12px; border-left:3px solid var(--rule-2); white-space:pre-line; overflow-wrap:anywhere; }
.idea-quote.clamp{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:var(--ink-2); font-size:.92em; }
.idea-dl{ margin:0; display:grid; gap:6px; }
.idea-dl > div{ display:grid; grid-template-columns:5.5em minmax(0,1fr); gap:10px; font-size:.9em; }
.idea-dl dt{ color:var(--ink-2); font-size:.86em; font-weight:700; padding-top:1px; }
.idea-dl dd{ margin:0; white-space:pre-line; overflow-wrap:anywhere; }
.sum-idea{ margin-left:auto; }
.charc .beat{ display:block; font-size:.92em; }

/* ---- コマ一覧 ---- */
.sumbox{ display:grid; gap:10px; }
.sumline{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; font-size:.86em; color:var(--ink-2); }
.sumline .g{ display:inline-flex; align-items:center; gap:5px; }
.sumline b{ font-family:var(--f-mono); color:var(--ink); font-weight:600; }
.pagehead{ display:flex; align-items:center; gap:10px; margin-top:8px; }
.pagehead .pno{ font-family:var(--f-mono); font-weight:600; font-size:1.05em; letter-spacing:.04em; }
.pagehead .rule{ flex:1; height:1px; background:var(--rule); }
.pagehead .cnt{ font-size:.8em; color:var(--ink-2); }
.pagehead .nthumb{ width:34px; height:34px; border-radius:6px; overflow:hidden; border:1px solid var(--rule); flex:none; background:var(--sheet-2); }
.pagehead .nthumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.cut{ display:flex; align-items:flex-start; gap:12px; padding:12px 14px; text-align:left; width:100%; }
.cut:hover{ border-color:var(--rule-2); }
.cut .stamp{ margin-top:2px; }
.cut-body{ flex:1; min-width:0; display:grid; gap:2px; }
.cut-meta,.cut-line,.cut-picks,.cut-miss{ display:block; }
.cut-top{ display:flex; align-items:center; gap:8px; min-width:0; }
.cut-id{ font-family:var(--f-mono); font-weight:600; font-size:1.05em; letter-spacing:.02em; }
.cut-cnt{ font-family:var(--f-mono); font-size:.82em; color:var(--ink-2); }
.cut-top .pill{ margin-left:auto; }
.cut-who{ display:flex; flex-wrap:wrap; gap:4px 10px; font-size:.86em; font-weight:700; }
.who{ display:inline-flex; align-items:center; gap:5px; }
.dot{ width:9px; height:9px; border-radius:50%; background:var(--c, var(--ink-3)); flex:none; display:inline-block; }
.cut-meta{ color:var(--ink-2); font-size:.82em; }
.cut-act{ font-size:.92em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.cut-line{ color:var(--ink-2); font-size:.84em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cut-miss{ color:var(--warn); font-size:.8em; font-weight:700; }
.cut-picks{ font-size:.82em; font-family:var(--f-mono); color:var(--st-picked); }

/* ---- 入力 ---- */
.field{ display:grid; gap:7px; min-width:0; }
.lbl{ font-size:.78em; color:var(--ink-2); letter-spacing:.06em; font-weight:700; }
input[type="text"],input[type="number"],input[type="password"],textarea,select{ width:100%; font-family:inherit; font-size:var(--fs-in); color:var(--ink); background:var(--sheet);
  border:1px solid var(--rule); border-radius:9px; padding:9px 11px; line-height:1.5; }
textarea{ resize:vertical; min-height:68px; display:block; }
input::placeholder,textarea::placeholder{ color:var(--ink-3); }
input:focus,textarea:focus,select:focus{ outline:2px solid var(--blue); outline-offset:0; border-color:transparent; }
.mono-ta{ font-family:var(--f-mono); font-size:max(13px, .86em); }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }

const IDB = {

  open() {

        rq.onupgradeneeded = () => { rq.result.createObjectStore('photos'); };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
        rq.onblocked = () => rej(new Error('blocked'));
      } catch (e) { rej(e); }
    });

    return this.p;
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', mode);
      const rq = fn(tx.objectStore('photos'));
      tx.oncomplete = () => res(rq ? rq.result : undefined);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  },
  put(k, v) { return this.run('readwrite', st => st.put(v, k)); },
  get(k) { return this.run('readonly', st => st.get(k)); },
  del(k) { return this.run('readwrite', st => st.delete(k)); },

    }).catch(() => { /* 読めない写真は空欄のまま */ });

  const s = { n: cuts.length, k: 0, t: 0, m: 0, cand: 0, miss: 0, st: { draft: 0, ready: 0, gen: 0, picked: 0, done: 0 } };
  for (const c of cuts) {
    if (c.grade === '決') s.k++; else if (c.grade === '無') s.m++; else s.t++;
    if (c.grade !== '無') s.cand += Math.max(0, num(c.count));

}

function cutVars(p, c, pid = UI.pid) {

    候補: !mu && num(c.count) > 0 ? `候補${num(c.count)}枚` : '',
    保存名: mu ? '' : saveName(p, c),
    キャラ: mu ? '' : chars.map(ch => (trim(ch.trigger) ? `${ch.name}（${trim(ch.trigger)}）` : ch.name)).join('、'),
    特徴: mu ? '' : chars.filter(ch => trim(ch.features)).map(ch => `${ch.name}＝${trim(ch.features)}`).join('；'),
    衣装: mu ? '' : chars.map(ch => { const t = costumeOf(sc, ch.id); return t ? `${ch.name}＝${t}` : ''; }).filter(Boolean).join('；'),
    構図: mu ? '' : [c.shot, c.angle, c.facing].filter(Boolean).join('・'),
    表情: mu ? '' : trim(c.action),
    背景: mu ? '' : [sc && sc.place, sc && sc.time, sc && sc.light, sc && trim(sc.lightNote), sc && sc.weather, trim(c.bg)].map(trim).filter(Boolean).join('／'),
    小物: mu ? '' : trim(sc && sc.props),
    縦横比: mu ? '' : aspectText(c.aspect),

    作り方: mu ? (c.muteKind || '') : '',

    保険: mu ? '' : trim(c.backup),
    動画: !mu && v.on ? [`${num(v.sec, 5)}秒`, trim(v.motion) && `動き: ${trim(v.motion)}`, v.camera && `カメラ: ${v.camera}`, v.sound && `音: ${v.sound}`].filter(Boolean).join('／') : '',
    プロンプト: mu ? '' : trim(c.prompt),

function fillTemplate(tpl, vars) {
  return tpl.split('\n').map(line => {
    const keys = Array.from(line.matchAll(/\{([^{}]+)\}/g), m => m[1]).filter(k => k in vars);
    if (keys.length && keys.every(k => !trim(vars[k]))) return null;
    return line.replace(/\{([^{}]+)\}/g, (m, k) => (k in vars ? vars[k] : m)).replace(/\s+$/, '');
  }).filter(l => l !== null).join('\n');
}

  return [head, ...cuts.map(c => fillTemplate(tpl, cutVars(p, c, pid)))].join('\n\n') + '\n';

let renderQueued = false, mainBlocked = false, sheetBlocked = false, pointerDown = false, lastMain = '', lastSheet = '';

  const st = computeStats(all);
  const s = settings();
  const idea = hasIdea(project()) ? `<button type="button" class="btn sm ghost" data-act="ideaEdit">${ICON.seed}はじまり</button>` : '';
  if (!all.length) {
    const how = aiReady() ? '下の「＋ コマ」で1コマずつ書いていくか、台本タブで Claude に台本やネーム写真から下書きを起こしてもらえます。' : '下の「＋ コマ」で1コマずつ書いていきます。';

  }
  const est = s.secPerImage > 0 && st.cand ? ` ・ 約${Math.max(1, Math.round(st.cand * s.secPerImage / 60))}分` : '';

function selGroups() {
  const m = new Map();
  for (const it of SEL.items) { if (!m.has(it.key)) m.set(it.key, []); m.get(it.key).push(it); }
  for (const arr of m.values()) arr.sort((a, b) => num(a.num) - num(b.num) || a.name.localeCompare(b.name));
  return m;
}
function selCutFor(key) {

  if (assigned) { const d = getDoc(P.cut(pid, assigned)); if (d) return Object.assign({}, d, { id: assigned }); }
  if (!key || key === '?') return null;
  return cutsOf(pid).find(c => cutKey(c) === key) || null;
}

  return intro + gchips + head + grid + `<div class="row-wrap"><label class="btn sm" for="f-selimg">${ICON.image}画像を足す</label><input id="f-selimg" type="file" accept="image/*" multiple class="vh" data-file="sel"><button type="button" class="btn sm ghost" data-act="selClear">読み込んだ画像を片付ける</button></div>`;

function clearSel(pid) {
  for (const it of SEL.items) { try { URL.revokeObjectURL(it.url); } catch (e) { /* noop */ } }
  Object.assign(SEL, { pid, items: [], cur: null, assign: {}, seq: 0 });
}
function parseCandName(name) {
  const base = String(name).replace(/\.[^.]+$/, '');
  const m = base.match(/(?:^|[^A-Za-z0-9])P(\d{1,3})-(\d{1,3})(?!\d)/i);
  const key = m ? `P${pad2(+m[1])}-${+m[2]}` : '?';
  const rest = m ? base.replace(m[0], ' ') : base;
  const c = rest.match(/_(\d{2,6})_?$/) || rest.match(/(\d+)(?!.*\d)/);
  return { key, num: c ? String(+c[1]) : null };
}
function selAdd(files) {
  let added = 0;
  for (const f of files) {
    if (!/^image\//.test(f.type || '') && !/\.(png|jpe?g|webp|gif|avif|heic)$/i.test(f.name)) continue;
    const pr = parseCandName(f.name);
    let n = pr.num;
    const taken = SEL.items.some(it => it.key === pr.key && it.num === n);
    if (!n || taken) n = 'x' + (++SEL.seq);
    SEL.items.push({ key: pr.key, num: n, name: f.name, url: URL.createObjectURL(f) });
    added++;
  }
  if (added && !SEL.cur) SEL.cur = SEL.items[0].key;
  toast(added ? `${added}枚を読み込みました` : '画像が見つかりませんでした');
  scheduleRender();
}

      ${aiReady() ? `<button type="button" class="btn" data-act="bulkConvert" ${noPrompt && !AI.bulk ? '' : 'disabled'}>${ICON.spark}Claudeで英語に</button>` : ''}
      <button type="button" class="btn" data-act="saveMenu">${ICON.download}ファイルに保存</button>
      ${vids.length ? `<button type="button" class="btn" data-act="copyVideos">${ICON.copy}動画ブリーフ</button>` : ''}

  if (!cuts.length) {

  }
  const list = cuts.map(c => {
    const g = GRADE[c.grade] || GRADE['通'];
    return `<article class="card xrow">
      <div class="xrow-top"><span class="stamp-s ${g.cls}">${g.k}</span><b class="mono">${cutKey(c)}</b><span class="cut-cnt">×${num(c.count)}</span>${c.video && c.video.on ? '<span class="cut-cnt">動画</span>' : ''}<span class="pill" data-st="${esc(ST[c.status] ? c.status : 'draft')}">${(ST[c.status] || ST.draft).label}</span></div>

  return head + `<div class="stack">${list}</div>`;
}

/* ---------- 部品 ---------- */
function chips(field, opts, cur, o = {}) {
  return `<div class="chips${o.scroll ? ' scroll' : ''}" role="group">${opts.map(op => {
    const isObj = op && typeof op === 'object';
    const v = isObj ? op.v : op;
    const label = isObj ? (op.raw ? op.label : esc(op.label)) : esc(op);
    const on = o.multi ? (cur || []).includes(v) : cur === v;
    return `<button type="button" class="chip" data-act="pick" data-field="${field}" data-val="${esc(v)}"${o.num ? ' data-num="1"' : ''}${o.multi ? ' data-multi="1"' : ''}${o.req ? ' data-req="1"' : ''} aria-pressed="${on}">${label}${isObj && op.sub ? `<small>${esc(op.sub)}</small>` : ''}</button>`;
  }).join('')}</div>`;
}
function stepper(field, val, o = {}) {
  const id = 'st-' + field;
  return `<div class="stepper"><button type="button" data-act="step" data-field="${field}" data-d="-1" aria-label="${esc(o.label || field)}を減らす">−</button><input id="${id}" type="number" inputmode="numeric" min="${o.min == null ? 1 : o.min}" value="${val == null ? '' : esc(val)}" data-change="${field}" aria-label="${esc(o.label || field)}"><button type="button" data-act="step" data-field="${field}" data-d="1" aria-label="${esc(o.label || field)}を増やす">＋</button></div>`;
}
function spaceGrid(sel) {
  sel = sel || [];
  return `<div class="spacegrid" role="group" aria-label="吹き出しの余白">${SPACE_GRID.map(s => s
    ? `<button type="button" data-act="pick" data-field="space" data-val="${s}" data-multi="1" aria-pressed="${sel.includes(s)}" aria-label="${s}">${sel.includes(s) ? ICON.balloon : ''}<span>${s}</span></button>`
    : `<div class="sg-c">人物</div>`).join('')}</div>`;
}
function linesInfo(t) {
  const ls = lines(t);
  if (!ls.length) return '1行が吹き出し1つ。1つの吹き出しは2〜3行（30字前後）が目安です。';
  const max = Math.max.apply(null, ls.map(x => x.replace(/[「」『』]/g, '').length));
  return `吹き出し${ls.length}つ・いちばん長いもの${max}字${max > 40 ? ' — 長めです。分けるか削ると読みやすくなります' : ''}`;
}
function twoHint(c) {
  if ((c.chars || []).length >= 2 && c.grade === '通') return '2人以上が同じコマに入ると崩れやすいので、通常のコマなら1人ずつの切り返しに分けるのも手です。';
  if ((c.chars || []).length >= 2 && c.grade === '決') return '見せ場の複数人コマ。候補を多めに出し、崩れたときの保険も書いておくと安心です。';
  return '';
}
function missHTML(c) {
  const miss = missingOf(c);
  if (miss.length) return `<div class="miss"><b>未記入</b>${esc(miss.join('・'))}</div>`;
  if ((c.status || 'draft') === 'draft') {
    const mu = c.grade === '無';
    return `<div class="okline">${ICON.check}<span>書き漏れなし</span><button type="button" class="btn sm" data-act="setStatus" data-val="${mu ? 'done' : 'ready'}">${mu ? '完成にする' : '生成待ちにする'}</button></div>`;
  }
  return '';
}

/* ---------- 編集シート ---------- */
const SHEETS = {};
function openSheet(kind, args) {
  UI.sheet = Object.assign({ kind }, args || {});
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  lastSheet = '';
  renderSheet(true);
  renderFab();
}
function closeSheet() {
  const s = UI.sheet;
  if (s && s.kind === 'import') { if (SYNC.busy === 'apply') return; SYNC.plan = null; SYNC.msg = ''; }
  if (s && s.kind === 'unlock') { if (SYNC.busy === 'unlock') return; SYNC.locked = null; SYNC.unlockMsg = ''; }
  if (s && s.fresh && s.path) {
    // 作ってすぐ何も書かずに閉じたキャラ・シーンは残さない
    const d = getDoc(s.path);
    const empty = d && (s.kind === 'char'
      ? !trim(d.name) && !trim(d.trigger) && !trim(d.features)
      : !trim(d.place) && !trim(d.beat) && !d.time && !d.light && !trim(d.lightNote) && !d.weather && !trim(d.props) && !cutsOf().some(c => c.sceneId === splitPath(s.path)[1]));
    if (empty) removeDoc(s.path);
  }
  UI.sheet = null;
  $('#layer').innerHTML = '';
  lastSheet = '';
  document.documentElement.style.overflow = '';
  document.body.style.overflow = '';
  sheetBlocked = false;
  if (s && s.returnTo && getDoc(s.returnTo.path)) { openSheet(s.returnTo.kind, { path: s.returnTo.path }); return; }
  scheduleRender();
}
function renderSheet(reset) {
  const s = UI.sheet;
  if (!s) return;
  const fn = SHEETS[s.kind];
  const html = fn ? fn(s) : null;
  if (html == null) { closeSheet(); return; }
  if (html === lastSheet && !reset) return;
  const body = $('#layer .sheet-body');
  const top = body && !reset ? body.scrollTop : 0;
  $('#layer').innerHTML = html;
  lastSheet = html;
  const nb = $('#layer .sheet-body');
  if (nb) nb.scrollTop = top;
  $$('#layer textarea[data-auto]').forEach(autosize);
}
function sheetFrame({ title, docPath, left, right, body, foot, label, compact }) {
  return `<div class="sheet-wrap" data-act="sheetBg"><section class="sheet${compact ? ' compact' : ''}" role="dialog" aria-modal="true" aria-label="${esc(label || '')}"${docPath ? ` data-doc="${esc(docPath)}"` : ''}>
    <header class="sheet-head">${left || `<button type="button" class="tbtn" data-act="closeSheet">${ICON.back}<span>閉じる</span></button>`}<div class="sheet-title">${title || ''}</div>${right || '<span style="width:42px"></span>'}</header>
    <div class="sheet-body">${body}</div>
    ${foot ? `<footer class="sheet-foot">${foot}</footer>` : ''}
  </section></div>`;
}

SHEETS.cut = s => {
  const pid = UI.pid;
  const c0 = getDoc(s.path);
  if (!c0) return null;
  const id = splitPath(s.path)[1];
  const c = Object.assign({}, c0, { id });
  const cuts = cutsOf(pid);
  const idx = cuts.findIndex(x => x.id === id);
  const prev = cuts[idx - 1], next = cuts[idx + 1];
  const mu = c.grade === '無';
  const scs = scenesOf(pid);
  const sc = sceneOf(c);
  const title = `<button type="button" class="ibtn" data-act="cutNav" data-id="${prev ? esc(prev.id) : ''}" ${prev ? '' : 'disabled'} aria-label="前のコマ">${ICON.left}</button><span class="mono big" id="sh-id">${cutKey(c)}</span><button type="button" class="ibtn" data-act="cutNav" data-id="${next ? esc(next.id) : ''}" ${next ? '' : 'disabled'} aria-label="次のコマ">${ICON.right}</button>`;
  const right = `<button type="button" class="ibtn" data-act="cutMenu" aria-label="このコマの操作">${ICON.more}</button>`;
  const sceneOpts = scs.map(x => ({ v: x.id, label: `<b class="mono">${esc(x.code || 'S')}</b> ${esc(x.place || trim(x.beat).slice(0, 14))}`, raw: true })).concat([{ v: '', label: 'なし' }]);
  let body = `<div id="sh-miss">${missHTML(c)}</div>
    <div class="row2"><div class="field"><span class="lbl">ページ</span>${stepper('page', num(c.page, 1), { label: 'ページ' })}</div><div class="field"><span class="lbl">コマ</span>${stepper('panel', num(c.panel, 1), { label: 'コマ' })}</div></div>
    <div class="field"><span class="lbl">区分</span><div class="seg3">${GRADES.map(g => `<button type="button" class="segbtn" data-act="setGrade" data-val="${g.k}" aria-pressed="${c.grade === g.k}"><span class="stamp-s ${g.cls}">${g.k}</span>${g.desc}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">状態</span>${chips('status', STATUSES.map(x => ({ v: x.k, label: x.label })), ST[c.status] ? c.status : 'draft', { scroll: true, req: true })}</div>
    <div class="field"><span class="lbl">シーン</span>${scs.length ? chips('sceneId', sceneOpts, c.sceneId || '') : `<p class="hint">シーンはまだありません。<button type="button" class="link" data-act="addSceneFromCut">ここで作る</button></p>`}${sc ? `<p class="hint">${esc(sceneSummary(sc))}</p>` : ''}</div>`;
  if (mu) {
    body += `<div class="field"><span class="lbl">作り方</span>${chips('muteKind', MUTE_KINDS, c.muteKind || '')}</div>
      <div class="field"><label class="lbl" for="f-mtext">内容</label><textarea id="f-mtext" data-bind="muteText" data-live="1" rows="3" placeholder="例: 実績解除「雨宿りの先客」／スマホに届くメッセージの文面">${esc(c.muteText || '')}</textarea></div>`;
  } else {
    const rs = roster();
    const ids = c.chars || [];
    const extra = ids.filter(x => !rs.find(r => r.id === x));
    const charChips = rs.length || extra.length ? `<div class="chips">${rs.map(r => `<button type="button" class="chip" data-act="pick" data-field="chars" data-val="${esc(r.id)}" data-multi="1" aria-pressed="${ids.includes(r.id)}"><i class="dot" style="--c:${safeColor(r.color)}"></i>${esc(r.name || '名無し')}</button>`).join('')}${extra.map(x => `<button type="button" class="chip" data-act="pick" data-field="chars" data-val="${esc(x)}" data-multi="1" aria-pressed="true">（削除したキャラ）</button>`).join('')}</div>`
      : `<p class="hint">キャラ名簿が空です。<button type="button" class="link" data-act="go" data-view="roster">名簿に追加</button></p>`;
    body += `<div class="field"><span class="lbl">登場キャラ</span>${charChips}<p class="hint" id="sh-two">${esc(twoHint(c))}</p></div>
      <div class="field"><span class="lbl">画角</span>${chips('shot', SHOTS, c.shot || '')}</div>
      <div class="field"><span class="lbl">アングル</span>${chips('angle', ANGLES, c.angle || '')}</div>
      <div class="field"><span class="lbl">向き</span>${chips('facing', FACINGS, c.facing || '')}<p class="hint">右から左へ読むので、話を前へ進めるコマは左向き、ためらい・振り返りは右向きが基本です。</p></div>
      <div class="field"><label class="lbl" for="f-action">表情・ポーズ</label><textarea id="f-action" data-bind="action" data-live="1" rows="2" placeholder="例: 振り向いて驚く／腕を組んで壁にもたれる">${esc(c.action || '')}</textarea></div>
      <div class="field"><label class="lbl" for="f-bg">このコマだけの背景・小物</label><input id="f-bg" type="text" data-bind="bg" data-live="1" value="${esc(c.bg || '')}" placeholder="シーンと違うときだけ。例: 窓の外の雨"></div>
      <div class="field"><span class="lbl">縦横比</span>${chips('aspect', ASPECTS.map(a => ({ v: a.k, label: a.k, sub: `${a.w}×${a.h}` })), c.aspect || '')}</div>
      <div class="field"><span class="lbl">吹き出しの余白</span>${spaceGrid(c.space)}<p class="hint">吹き出しを置く場所。家では引き気味に出して、あとでトリミングします。</p></div>
      <div class="field"><span class="lbl">候補数</span><div class="row-wrap">${stepper('count', num(c.count), { min: 0, label: '候補数' })}${chips('count', COUNTS.map(n => ({ v: n, label: String(n) })), num(c.count), { num: true, req: true })}</div></div>
      <div class="field"><label class="lbl" for="f-backup">保険（崩れたときの代案）</label><input id="f-backup" type="text" data-bind="backup" value="${esc(c.backup || '')}" placeholder="例: 横顔の寄りに逃がす／2人を別々のコマに分ける"></div>`;
  }
  body += `<div class="field"><label class="lbl" for="f-lines">台詞</label><textarea id="f-lines" data-bind="lines" data-live="1" rows="3" placeholder="1行が吹き出し1つ。例: 「……いつから？」">${esc(c.lines || '')}</textarea><p class="hint" id="sh-lines">${esc(linesInfo(c.lines))}</p></div>`;

// 段取りに上げるときに、プロットから作るシーン・コマの案
function promoteItems(p, kind, off) {
  const pid = UI.pid;
  off = off || {};
  const items = [];
  const flow = flowOf(p).filter(f => trim(f.t));
  const chars = charsOf(p).filter(id => charById(id));
  const scs = scenesOf(pid);
  const codes = new Set(scs.map(x => String(x.code)));
  let sn = scs.length;
  const nextCode = () => { let c; do { sn++; c = 'S' + pad2(sn); } while (codes.has(c)); codes.add(c); return c; };
  const addScene = it => { it.code = off[it.key] ? '' : nextCode(); items.push(it); return it; };
  if (kind === 'manga') {
    flow.forEach((f, i) => addScene({ key: 'scene:' + f.id, type: 'scene', beat: trim(f.t), place: '', from: `流れの${i + 1}行目から` }));
    if (!flow.length && trim(p.setting)) addScene({ key: 'scene:setting', type: 'scene', beat: '', place: trim(p.setting), from: '舞台・状況から' });
    return items;
  }
  const sc = trim(p.setting) ? addScene({ key: 'scene:setting', type: 'scene', beat: '', place: trim(p.setting), from: '舞台・状況から' }) : null;
  let pn = maxPanel(1, pid);
  const addCut = it => { it.page = 1; it.panel = off[it.key] ? 0 : ++pn; it.chars = chars; it.scene = sc ? sc.key : ''; items.push(it); };
  const mise = trim(p.mise), seed1 = firstLine(p.seed);
  if (mise) addCut({ key: 'cut:mise', type: 'cut', grade: '決', action: mise, from: '見せ場から' });
  else if (!flow.length && seed1) addCut({ key: 'cut:seed', type: 'cut', grade: '決', action: seed1, from: 'タネの一行目から' });
  flow.forEach((f, i) => addCut({ key: 'cut:' + f.id, type: 'cut', grade: '通', action: trim(f.t), from: kind === 'sabun' ? `差分の${i + 1}枚目` : `構図の案 ${i + 1}` }));
  return items;
}
SHEETS.promote = s => {
  const p = project();
  if (!p) return null;
  const d = s.draft;
  const items = promoteItems(p, d.kind, d.off);
  const nOn = items.filter(it => !d.off[it.key]).length;
  const ready = loaded(P.cuts(UI.pid)) && loaded(P.scenes(UI.pid));
  const list = items.length ? `<div class="dr-list">${items.map(it => {
    const on = !d.off[it.key];
    const mark = it.type === 'scene' ? '<span class="stamp-s t">場</span>' : `<span class="stamp-s ${GRADE[it.grade].cls}">${it.grade}</span>`;
    const id = it.type === 'scene' ? (on ? it.code : 'シーン') : (on ? cutKey(it) : 'コマ');
    const what = it.type === 'scene' ? (it.beat || it.place) : it.action;
    return `<label class="dr-item"><input type="checkbox" data-act="promoteToggle" data-k="${esc(it.key)}" ${on ? 'checked' : ''}>${mark}<span class="t"><b>${esc(id)}${on ? '' : '（作らない）'}</b><span>${esc(what)}</span><span class="dim">${esc(it.from)}</span></span></label>`;
  }).join('')}</div>` : `<p class="hint">プロットから作るものはありません。カット表は白紙から始まります。</p>`;
  const how = d.kind === 'manga'
    ? '流れの1行ずつを、シーン（場面）にします。コマは台本を書いてから足していきます。'
    : '見せ場を「決」のコマに、' + (d.kind === 'sabun' ? '差分の並びを1枚ずつ' : '構図の案を1つずつ') + '「通」のコマにします。舞台・状況はシーンにします。';
  const body = `<p class="lede">段取りに上げると、カット表を書く画面になります。タネとプロットは「はじまり」として作品の中に残り、台本タブとコマ一覧からいつでも見返せます。</p>
    <div class="field"><label class="lbl" for="f-prtitle">題名</label><input id="f-prtitle" type="text" data-draft="title" value="${esc(d.title)}" placeholder="例: 雨の宿"></div>
    <div class="field"><span class="lbl">種類</span><div class="chips">${KINDS.map(k => `<button type="button" class="chip" data-act="promoteKind" data-val="${k.k}" aria-pressed="${d.kind === k.k}">${k.label}</button>`).join('')}</div></div>
    <div class="field"><label class="lbl" for="f-prabbr">保存名の頭（略称）</label><input id="f-prabbr" type="text" data-draft="abbr" value="${esc(d.abbr)}" placeholder="例: amayado" autocapitalize="off" spellcheck="false"><p class="hint">家で画像を保存するときのフォルダ名になります。空なら題名を使います。半角英数字が無難です。</p></div>
    <div class="field"><label class="lbl" for="f-prlog">一行あらすじ</label><input id="f-prlog" type="text" data-draft="logline" value="${esc(d.logline)}" placeholder="この話は何の話か、一文で"></div>
    <div class="field"><span class="lbl">プロットから作るもの</span><p class="hint">${esc(how)}外したものは作りません。</p>${list}</div>`;
  const foot = `<button type="button" class="btn" data-act="closeSheet">やめる</button><button type="button" class="btn pri" data-act="promoteApply" ${ready ? '' : 'disabled'}>${ICON.up}段取りに上げる${nOn ? `（${nOn}）` : ''}</button>`;
  return sheetFrame({ title: '<span class="tt">段取りに上げる</span>', body, foot, label: '段取りに上げる' });
};

SHEETS.import = s => {
  const pl = SYNC.plan;
  if (!pl) return null;
  const nothing = !pl.put.length && !pl.del.length;
  const lines = KIND_ORDER.filter(k => pl.counts[k]).map(k => {
    const c = pl.counts[k];
    const parts = [c.add && `追加 ${c.add}`, c.upd && `更新 ${c.upd}`, c.del && `削除 ${c.del}`].filter(Boolean);
    return `<div class="xline"><span class="lbl">${KIND_LABEL[k]}</span><span>${parts.join('・')}</span></div>`;
  }).join('');
  const when = pl.exportedAt ? fmtDateTime(Date.parse(pl.exportedAt)) : '';
  const src = FROM_LABEL[pl.from] || '';
  const nPh = Object.keys(pl.photos).length;

/* ---------- コピーと保存 ---------- */
function copyText(text, what) {
  const done = () => toast(`${what}をコピーしました`);
  const fallback = () => openSheet('copy', { title: what, text });
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => { if (!legacyCopy(text)) fallback(); else done(); });
      return;
    }
  } catch (e) { /* 下で試す */ }
  if (legacyCopy(text)) done(); else fallback();
}
function legacyCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand && document.execCommand('copy');
    ta.remove();
    return !!ok;
  } catch (e) { return false; }
}
async function saveFile(filename, text, mime) {
  const dl = Caps.downloads;
  if (dl) {
    try {
      const r = await dl.save({ filename, data: text });
      if (r && r.status === 'saved') toast('保存しました');
      return true;
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') return false;
      if (code === 'rate_limited') { toast('保存の確認が開いたままです。閉じてからもう一度押してください'); return false; }
    }
  }
  if (OFFLINE || !window.claude) {
    // このページだけで開いているとき（オフライン版）: スマホは共有シート、ほかは普通のダウンロード
    const blob = new Blob([text], { type: mime || 'text/plain' });
    try {
      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && typeof File === 'function' && navigator.canShare) {
        const file = new File([blob], filename, { type: blob.type });
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return true; }
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return false;
    }
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 15000);
      toast('保存しました');
      return true;
    } catch (e) { /* 下でコピーに切り替える */ }
  }
  openSheet('copy', { title: filename, text });
  return false;
}

function normDraft(res, p, scs, startPage) {
  const out = { scenes: [], cuts: [] };
  if (!res || typeof res !== 'object') return out;
  const rs = roster();
  const norm = s => String(s || '').toLowerCase().replace(/[\s　・]/g, '');
  const charId = name => {
    const n = norm(name);
    const hit = rs.find(ch => norm(ch.name) === n || (trim(ch.trigger) && norm(ch.trigger) === n));
    return hit ? hit.id : null;
  };
  const codes = new Set(scs.map(s => String(s.code)));
  for (const s of Array.isArray(res.scenes) ? res.scenes : []) {
    const code = trim(s && s.code);
    if (!code || codes.has(code)) continue;
    codes.add(code);
    out.scenes.push({ sel: true, code, place: trim(s.place), time: TIMES.includes(s.time) ? s.time : '', light: LIGHTS.includes(s.light) ? s.light : '', lightNote: LIGHTS.includes(s.light) ? '' : trim(s.light), weather: WEATHERS.includes(s.weather) ? s.weather : '' });
  }
  const aspMap = { 縦長: '縦', 横長: '横', 正方: '正方形' };
  for (const c of Array.isArray(res.cuts) ? res.cuts : []) {
    if (!c || typeof c !== 'object') continue;
    const unknown = [];
    const chars = (Array.isArray(c.chars) ? c.chars : []).map(n => { const id = charId(n); if (!id && trim(n)) unknown.push(trim(n)); return id; }).filter(Boolean);
    const grade = GRADE[c.grade] ? c.grade : '通';
    const asp = ASPECT[c.aspect] ? c.aspect : (aspMap[c.aspect] || '');
    const notes = [trim(c.notes), unknown.length ? `名簿にないキャラ: ${unknown.join('、')}` : ''].filter(Boolean).join('／');
    out.cuts.push({
      sel: true,
      page: Math.max(1, Math.round(num(c.page, startPage))), panel: Math.max(1, Math.round(num(c.panel, 1))),
      sceneCode: trim(c.scene), grade, chars,
      shot: SHOTS.includes(c.shot) ? c.shot : '', angle: ANGLES.includes(c.angle) ? c.angle : '', facing: FACINGS.includes(c.facing) ? c.facing : '',
      action: trim(c.action), aspect: asp, space: (Array.isArray(c.space) ? c.space : []).filter(x => SPACES.includes(x)).slice(0, 3),
      lines: Array.isArray(c.lines) ? c.lines.map(trim).filter(Boolean).join('\n') : trim(c.lines),
      muteKind: MUTE_KINDS.includes(c.muteKind) ? c.muteKind : (grade === '無' && trim(c.muteKind) ? 'その他' : ''),
      muteText: trim(c.muteText), backup: trim(c.backup), notes, count: GRADE[grade].count,
    });
  }
  out.cuts.sort((a, b) => a.page - b.page || a.panel - b.panel);
  // 既存のコマと番号が重なるものは、そのページの後ろへずらす
  const taken = new Map();
  for (const c of cutsOf()) { const pg = num(c.page, 1); if (!taken.has(pg)) taken.set(pg, new Set()); taken.get(pg).add(num(c.panel)); }
  const fresh = new Map();
  for (const c of out.cuts) {
    const t = taken.get(c.page);
    if (!fresh.has(c.page)) fresh.set(c.page, new Set());
    const f = fresh.get(c.page);
    if ((t && t.has(c.panel)) || f.has(c.panel)) {
      const all = new Set([...(t || []), ...f]);
      c.panel = Math.max(0, ...all) + 1;
      c.moved = true;
    }
    f.add(c.panel);
  }
  return out;
}

async function compressImage(file, max = 2000, q = 0.85) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.decoding = 'async';
    img.src = url;
    await img.decode();
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', q));
    return blob || file;
  } finally { URL.revokeObjectURL(url); }
}

let statsTimer = null;

function saveStats() {
  const pid = UI.pid;
  if (!pid || !loaded(P.cuts(pid)) || !project(pid) || stageOf(project(pid)) !== 'dandori') return;
  const cuts = cutsOf(pid);
  const st = computeStats(cuts);
  const last = cuts.reduce((m, c) => Math.max(m, num(c.updatedAt)), 0);
  const lastMin = Math.floor(last / 60000) * 60000;
  const p = project(pid);
  if (JSON.stringify(p.stats || null) === JSON.stringify(st) && num(p.lastEdit) >= lastMin) return;
  mutate(P.project(pid), d => { d.stats = st; d.lastEdit = Math.max(lastMin, num(d.lastEdit)); }, { keepTime: true });
}

ACT.importApply = async () => {
  const pl = SYNC.plan;
  if (!pl || SYNC.busy) return;
  SYNC.busy = 'apply'; SYNC.prog = ''; SYNC.msg = '';
  lastSheet = ''; renderSheet(false);
  let res;
  try {
    res = await applyImport(pl, (i, n) => { SYNC.prog = `${i}/${n}`; scheduleRender(); });
  } catch (e) {
    SYNC.busy = '';
    SYNC.msg = '取り込みの途中で失敗しました。もう一度取り込むと、続きから入ります。';
    scheduleRender();
    return;
  }
  SYNC.busy = '';
  lsSet('dandori.lastImport', now());
  closeSheet();
  if (UI.view === 'home' || UI.view === 'sync') { lastMain = ''; }
  toast(res.photoFail ? `${res.total}件を取り込みました（写真${res.photoFail}枚は入りませんでした）` : `${res.total}件を取り込みました`);
};
ACT.selectCopy = () => { const ta = $('#f-copybox'); if (ta) { ta.focus(); ta.select(); try { ta.setSelectionRange(0, ta.value.length); } catch (e) { /* noop */ } } };

// 台本タブ・下書き
ACT.draftScript = t => { DRAFT.useScript = t.checked; };
ACT.draftPhoto = t => {
  const id = t.dataset.id;
  const max = aiImages() ? num(Caps.limits.images.maxCount, 0) : 0;
  if (DRAFT.photos.has(id)) DRAFT.photos.delete(id);
  else if (DRAFT.photos.size + DRAFT.extra.length >= max) { toast(`写真は${max}枚までです`); return; }
  else DRAFT.photos.add(id);
  scheduleRender();
};
ACT.draftClearExtra = () => { DRAFT.extra = []; scheduleRender(); };
ACT.draftRun = () => runDraft();
ACT.draftStop = () => { if (DRAFT.ctl) DRAFT.ctl.abort(); };
ACT.draftToggle = t => { const r = DRAFT.result; if (!r) return; const it = r[t.dataset.kind][num(t.dataset.i)]; if (it) it.sel = t.checked; scheduleRender(); };
ACT.draftApply = () => applyDraft();
ACT.draftRedo = () => { DRAFT.retry = true; DRAFT.state = 'idle'; DRAFT.result = null; runDraft(); };
ACT.draftDiscard = () => { Object.assign(DRAFT, { state: 'idle', result: null, msg: '' }); scheduleRender(); };
ACT.openName = t => openSheet('name', { path: P.name(UI.pid, t.dataset.id) });
ACT.nameZoom = () => { if (UI.sheet) { UI.sheet.zoom = !UI.sheet.zoom; renderSheet(false); } };
ACT.nameToCuts = () => {
  const d = getDoc(UI.sheet.path);
  closeSheet();
  UI.tab = 'cuts'; UI.filter = 'all'; lastMain = ''; render();
  if (d) setTimeout(() => { const h = $$('.pagehead .pno').find(x => x.textContent === `P${pad2(num(d.page, 1))}`); if (h) h.scrollIntoView({ block: 'start' }); }, 60);
};
ACT.delName = async () => {
  const path = UI.sheet.path;
  const d = getDoc(path);
  if (!(await ask({ title: 'この写真を消しますか？', body: '元に戻せません。', ok: '消す', danger: true }))) return;
  dropPhoto(d);
  removeDoc(path);
  closeSheet();
};

// 選別
ACT.selGroup = t => { SEL.cur = t.dataset.k; render(); };
ACT.selOpen = t => openSheet('pick', { key: SEL.cur, i: num(t.dataset.i) });
ACT.pickNav = t => { const s = UI.sheet; s.i = num(s.i) + num(t.dataset.d); s.zoom = false; renderSheet(true); };
ACT.pickZoom = (t, e) => { if (e.target.closest('.vnav')) return; UI.sheet.zoom = !UI.sheet.zoom; renderSheet(false); };
ACT.pickMark = t => {
  const s = UI.sheet;
  const arr = selGroups().get(s.key) || [];
  const it = arr[s.i];
  const cut = selCutFor(s.key);
  if (!it || !cut) return;
  const m = t.dataset.m;
  mutate(P.cut(UI.pid, cut.id), d => {
    const pk = Object.assign({}, d.picks || {});
    if (pk[it.num] && pk[it.num].m === m) delete pk[it.num];
    else pk[it.num] = { m, n: pk[it.num] && pk[it.num].m === '△' ? (pk[it.num].n || '') : '' };
    d.picks = pk;
  });
  // 印を付けたら次の候補へ（△は直す所を書くので留まる）
  const marked = getDoc(P.cut(UI.pid, cut.id));
  if (m !== '△' && marked && marked.picks && marked.picks[it.num] && s.i < arr.length - 1) { setTimeout(() => { if (UI.sheet === s) { s.i++; renderSheet(true); } }, 220); }
};
ACT.selDone = () => {
  const cut = selCutFor(SEL.cur);
  if (!cut) return;
  mutate(P.cut(UI.pid, cut.id), d => { if (!ST[d.status] || ST[d.status].i < ST.picked.i) d.status = 'picked'; });
  toast(`${cutKey(cut)} を採用済にしました`);
};
ACT.selClear = async () => { if (await ask({ title: '読み込んだ画像を片付けますか？', body: '付けた印はコマに残ります。', ok: '片付ける' })) { clearSel(UI.pid); render(); } };

// 書き出し
ACT.expSt = t => { UI.expSt = t.dataset.k; render(); };
ACT.expPage = t => { UI.expPage = t.dataset.k === 'all' ? 'all' : num(t.dataset.k); render(); };
function cutFromAttr(t) { const d = getDoc(P.cut(UI.pid, t.dataset.id)); return d ? Object.assign({}, d, { id: t.dataset.id }) : null; }
ACT.copyName = t => { const c = cutFromAttr(t); if (c) copyText(saveName(project(), c), '保存名'); };
ACT.copyPrompt = t => { const c = cutFromAttr(t); if (c && trim(c.prompt)) copyText(trim(c.prompt), 'プロンプト'); };
ACT.copyOrder = t => { const c = cutFromAttr(t); if (c) copyText(orderText(project(), [c]), '発注書'); };
ACT.markGen = t => { mutate(P.cut(UI.pid, t.dataset.id), d => { d.status = 'gen'; }); toast('選別待ちにしました'); };
ACT.copyOrderAll = () => { const cs = exportCuts(); if (cs.length) copyText(orderText(project(), cs), '発注書'); };
ACT.copyPromptsAll = () => {
  const cs = exportCuts().filter(c => trim(c.prompt));
  if (cs.length) copyText(cs.map(c => trim(c.prompt).replace(/\s*\n\s*/g, ' ')).join('\n') + '\n', `プロンプト${cs.length}行`);
};
ACT.copyVideos = () => { const p = project(); const vs = cutsOf().filter(c => c.grade !== '無' && c.video && c.video.on); if (vs.length) copyText(vs.map(c => videoBrief(p, c)).join('\n\n') + '\n', '動画ブリーフ'); };
ACT.copyPicks = () => {
  const cs = cutsOf().filter(c => c.grade !== '無' && (picksText(c) || trim(c.chosen)));
  if (!cs.length) { toast('まだ選別の印がありません'); return; }
  copyText(cs.map(c => `${cutKey(c)}: ${[picksText(c), trim(c.chosen)].filter(Boolean).join(' ／ ')}`).join('\n') + '\n', '選別結果');
};
ACT.bulkConvert = () => runConvertBulk();
ACT.bulkStop = () => { if (AI.bulk && AI.bulk.ctl) AI.bulk.ctl.abort(); };
ACT.saveMenu = async () => {
  const p = project();
  const k = await menu('ファイルに保存', [
    { k: 'order', label: '発注書（.txt）— いま絞り込んでいるコマ' },
    { k: 'prompts', label: 'プロンプト一覧（.txt）— 1行に1つ' },
    { k: 'sync', label: '受け渡し用ファイル（全部）— 別の端末へ' },
  ]);
  const base = abbrOf(p);
  if (k === 'order') saveFile(`${base}_発注書_${dateStamp()}.txt`, orderText(p, exportCuts()));
  else if (k === 'prompts') { const cs = exportCuts().filter(c => trim(c.prompt)); if (!cs.length) { toast('プロンプトのあるコマがありません'); return; } saveFile(`${base}_プロンプト_${dateStamp()}.txt`, cs.map(c => trim(c.prompt).replace(/\s*\n\s*/g, ' ')).join('\n') + '\n'); }
  else if (k === 'sync') go('sync');
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act];
  if (fn) fn(t, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset) return;
  if (el.dataset.bind && el.type !== 'checkbox') onBind(el);
  else if (el.dataset.cos != null) onCostume(el);
  else if (el.dataset.pickNote) onPickNote(el);
  else if (el.dataset.draft && UI.sheet && UI.sheet.draft) UI.sheet.draft[el.dataset.draft] = el.value;
  else if (el.dataset.seed) onSeedInput(el);
  else if (el.dataset.flowId) flowMutate(el.dataset.pid, a => { const x = a.find(y => y.id === el.dataset.flowId); if (x) x.t = el.value; });
  else if (el.dataset.todoId) todoMutate(el.dataset.pid, a => { const x = a.find(y => y.id === el.dataset.todoId); if (x) x.t = el.value; });
  if (el.matches && el.matches('textarea[data-auto]')) autosize(el);
});
let seedTimer = null;
function onSeedInput(el) {
  UI.seedText = el.value;
  clearTimeout(seedTimer);
  seedTimer = setTimeout(() => lsSet('dandori.seedDraft', UI.seedText), 300);
}
// 流れの行は Enter で次の行へ、空の行で ← を押すと前の行へ（変換中の Enter は数えない）
document.addEventListener('keydown', e => {
  const el = e.target;
  if (!el || !el.dataset || (e.key !== 'Enter' && e.key !== 'Backspace')) return;
  if (e.isComposing || e.keyCode === 229) return;
  if (el.dataset.flowId) {
    const pid = el.dataset.pid;
    const fl = flowOf(getDoc(P.project(pid)));
    const i = fl.findIndex(x => x.id === el.dataset.flowId);
    if (i < 0) return;
    if (e.key === 'Enter') { e.preventDefault(); flowInsert(pid, i + 1); return; }
    if (el.value === '' && fl.length > 1 && el.selectionStart === 0) {
      e.preventDefault();
      const to = fl[i - 1] || fl[i + 1];
      flowMutate(pid, a => a.splice(i, 1));
      focusSoon('#f-flow-' + to.id);
    }
    return;
  }
  if (e.key !== 'Enter') return;
  if (el.dataset.todoNew != null) { e.preventDefault(); todoAddFrom(el); return; }
  if (el.dataset.todoId) { e.preventDefault(); el.blur(); return; }
  if (el.dataset.seed && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ACT.seedSave(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.type === 'checkbox' && el.dataset.bind) { onBind(el); return; }
  if (el.dataset && el.dataset.change) {
    const f = el.dataset.change;
    if (f === 'selAssign') { if (el.value) { SEL.assign[SEL.cur] = el.value; scheduleRender(); } return; }
    const v = Math.round(num(el.value, 0));
    // 数字を打ったあと別のボタンを押したときに、そのボタンの押下が消えないよう、描き直しは後に回す
    if (document.activeElement === el) el.blur();
    applyStep(f, v, el);
    return;
  }
  if (el.dataset && el.dataset.file) {
    const files = Array.from(el.files || []);
    el.value = '';
    if (!files.length) return;
    const k = el.dataset.file;
    if (k === 'names') addNamePhotos(files);
    else if (k === 'refs') { if (UPR) { toast('写真を保存しているところです。終わってから選んでください'); return; } blurTyping(); addRefPhotos(UI.pid, files).then(n => { if (n) toast(`資料写真を${n}枚保存しました`); }); }
    else if (k === 'seedphoto') seedWithPhotos(files);
    else if (k === 'sel') selAdd(files);
    else if (k === 'syncin') syncReadFile(files[0]);
    else if (k === 'draftimg') {
      const max = aiImages() ? num(Caps.limits.images.maxCount, 0) : 0;
      DRAFT.extra = DRAFT.extra.concat(files.filter(f => /^image\//.test(f.type || ''))).slice(0, Math.max(0, max - DRAFT.photos.size));
      scheduleRender();
    }
  }
});
function onBind(el) {
  const host = el.closest('[data-doc]');
  if (!host || !host.dataset.doc) return;
  const path = host.dataset.doc;
  const f = el.dataset.bind;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.type === 'num') v = num(v, 0);
  mutate(path, d => setField(d, f, v), { create: host.dataset.create === '1' });
  if (el.dataset.live && UI.sheet && UI.sheet.path === path) liveCut(path);
  if (el.type === 'checkbox') { lastSheet = ''; renderSheet(false); }
}
function liveCut(path) {
  const c = getDoc(path);
  if (!c) return;
  const m = $('#sh-miss'); if (m) m.innerHTML = missHTML(c);
  const l = $('#sh-lines'); if (l) l.textContent = linesInfo(c.lines);
}
function onCostume(el) {
  const i = num(el.dataset.cos), k = el.dataset.k;
  mutate(UI.sheet.path, d => {
    const cos = Array.isArray(d.costumes) ? d.costumes.map(x => Object.assign({}, x)) : [];
    if (cos[i]) cos[i][k] = el.value;
    d.costumes = cos;
  });
}
function onPickNote(el) {
  const s = UI.sheet;
  const it = (selGroups().get(s.key) || [])[s.i];
  const cut = selCutFor(s.key);
  if (!it || !cut) return;
  mutate(P.cut(UI.pid, cut.id), d => {
    const pk = Object.assign({}, d.picks || {});
    if (pk[it.num]) pk[it.num] = Object.assign({}, pk[it.num], { n: el.value });
    d.picks = pk;
  });
}

// 選別ビューア: 左右のスワイプとキーボードで送る（閉じるのは画面のボタンで）
let swipe = null;
document.addEventListener('touchstart', e => {
  if (!UI.sheet || UI.sheet.kind !== 'pick' || UI.sheet.zoom) return;
  if (!e.target.closest('#pick-stage')) return;
  const t = e.touches[0]; swipe = { x: t.clientX, y: t.clientY };
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!swipe || !UI.sheet || UI.sheet.kind !== 'pick') { swipe = null; return; }
  const t = e.changedTouches[0];
  const dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
  swipe = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    const arr = selGroups().get(UI.sheet.key) || [];
    const ni = UI.sheet.i + (dx < 0 ? 1 : -1);
    if (ni >= 0 && ni < arr.length) { UI.sheet.i = ni; renderSheet(true); }
  }
}, { passive: true });
document.addEventListener('keydown', e => {
  if (!UI.sheet || UI.sheet.kind !== 'pick' || isTyping(e.target)) return;
  const arr = selGroups().get(UI.sheet.key) || [];
  if (e.key === 'ArrowRight' && UI.sheet.i < arr.length - 1) { UI.sheet.i++; renderSheet(true); }
  else if (e.key === 'ArrowLeft' && UI.sheet.i > 0) { UI.sheet.i--; renderSheet(true); }
  else { const mk = { '1': '◎', '2': '○', '3': '△', '4': '×' }[e.key]; if (mk) { const b = $(`.markbtn[data-m="${mk}"]`); if (b) b.click(); } }
});

// 画面を離れるときは、保存待ちを先に送る
function flushAll() { if (Store.mode !== 'cloud') { if (Store.mode === 'local') persistLocal(); return; } for (const p of Array.from(Store.timers.keys())) { clearTimeout(Store.timers.get(p)); flush(p); } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { saveStats(); flushAll(); } });
window.addEventListener('pagehide', flushAll);

function applySize() { document.documentElement.dataset.size = lsGet('dandori.size', 'm') === 'l' ? 'l' : ''; }

/* ---------- 起動 ---------- */
async function init() {
  applySize();
  render();
  loadCaps();
  let db = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
  }
  if (db) {
    Store.db = db; Store.mode = 'cloud';
    watchCol(P.roster); watchCol(P.projects); watchDoc(P.settings); watchDoc(P.tombs);
  } else {
    Store.mode = 'local';
    loadLocal();
    if (OFFLINE) { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => null); } catch (e) { /* noop */ } }
  }
  const last = lsGet('dandori.last', null);
  if (last) {
    const tryOpen = () => {
      if (!loaded(P.projects)) { setTimeout(tryOpen, 150); return; }
      if (project(last) && UI.view === 'home') openProject(last);
    };
    tryOpen();
  }
  render();
}
init();
})();
</script>

(function () {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();
</script>
